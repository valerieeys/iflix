{% load static %}

<!-- Navbar -->
<nav id="navbar" class="bg-transparent backdrop-blur-sm fixed top-0 w-full z-50 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <a href="{% url 'home' %}" class="flex items-center">
                <img src="{% static 'images/logo_transparent.png' %}" alt="Logo" class="h-24 w-auto">
            </a>

            <!-- Desktop Menu -->
            <div class="hidden md:block">
                <div class="ml-10 flex items-baseline space-x-8">
                    <a href="{% url 'home' %}" class="text-white hover:text-yellow-400 hover:underline underline-offset-8 decoration-yellow-400 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
                        Home
                    </a>
                    <a href="#" class="text-white hover:text-yellow-400 hover:underline underline-offset-8 decoration-yellow-400 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
                        Sedang Tayang
                    </a>
                    <a href="#" class="text-white hover:text-yellow-400 hover:underline underline-offset-8 decoration-yellow-400 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
                        Coming Soon
                    </a>
                    <a href="#" class="text-white hover:text-yellow-400 hover:underline underline-offset-8 decoration-yellow-400 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
                        Bioskop
                    </a>
                    <a href="#" class="text-white hover:text-yellow-400 hover:underline underline-offset-8 decoration-yellow-400 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
                        Jadwal
                    </a>
                </div>
            </div>

            <!-- Auth Buttons -->
            <div class="hidden md:flex items-center space-x-4">
                <button class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 px-4 py-2 hover:text-white rounded-md text-sm font-medium transition-colors duration-200">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Sign in</span>
                </button>
            </div>

            <!-- Mobile menu button -->
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-gray-300 hover:text-white inline-flex items-center justify-center p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white">
                    <!-- Icon Menu -->
                    <i id="menu-icon" class="fa-solid fa-bars text-2xl"></i>
                    <!-- Icon Close -->
                    <i id="close-icon" class="fa-solid fa-xmark text-2xl hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="md:hidden hidden">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-gray-800">
            <a href="#" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                Home
            </a>
            <a href="#" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                Sedang Tayang
            </a>
            <a href="#" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                Coming Soon
            </a>
            <a href="#" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                Bioskop
            </a>
            <a href="#" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                Jadwal
            </a>
            <div class="border-t border-gray-700 pt-4 pb-3">
                <div class="flex items-center px-3 space-x-3">
                    <button class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 block px-3 py-2 rounded-md text-base font-medium w-full">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Sign in</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

<script src="{% static 'js/navbar.js' %}"></script>
