<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iflix - Booking Tiket Bioskop</title>
    
    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body>
    {% include 'navbar.html' %}

    {% block content %}

    <!-- Hero Banner -->
    <section class="bg-cover bg-center h-64 flex items-center justify-center text-center" style="background-image: url('https://source.unsplash.com/1600x600/?cinema');">
        <div class="bg-black bg-opacity-60 p-6 rounded-lg">
            <h2 class="text-3xl md:text-4xl font-bold mb-2">Selamat Datang di iFlix</h2>
            <p class="text-gray-300">Booking tiket bioskop favoritmu sekarang juga!</p>
        </div>
    </section>

    <!-- Daftar Film -->
    <section class="p-8">
        <h3 class="text-2xl font-semibold mb-6">Sedang Tayang</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Contoh Kartu Film -->
            <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden">
                <img src="https://source.unsplash.com/400x600/?movie" alt="Judul Film" class="w-full h-64 object-cover">
                <div class="p-4">
                    <h4 class="text-xl font-bold">Judul Film</h4>
                    <p class="text-sm text-gray-400 mb-2">Genre • 2 Jam 15 Menit</p>
                    <a href="#" class="inline-block mt-2 px-4 py-2 bg-red-500 hover:bg-red-600 rounded text-white text-sm font-semibold">Pesan Tiket</a>
                </div>
            </div>
            <!-- Duplikat kartu ini untuk film lainnya -->
        </div>
    </section>

    {% endblock content %}
    <!-- Footer -->
    <footer class="bg-gray-800 text-center py-4 text-sm text-gray-400">
        &copy; 2025 iFlix. Semua hak dilindungi.
    </footer>
</body>
</html>
